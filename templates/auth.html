<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Đăng ký' if mode=='register' else 'Đăng nhập' }} - GigaTech</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container checkout-page"><section class="glass-panel checkout-panel"><a class="back-link" href="{{ url_for('index') }}">← GigaTech</a><h1>{{ 'Tạo tài khoản' if mode=='register' else 'Đăng nhập' }}</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}">{% if mode=='register' %}<div class="checkout-form-group"><label>Họ tên</label><input class="checkout-input" name="name" required minlength="2"></div>{% endif %}<div class="checkout-form-group"><label>Email</label><input class="checkout-input" type="email" name="email" required></div><div class="checkout-form-group"><label>Mật khẩu</label><input class="checkout-input" type="password" name="password" required minlength="8"></div><button class="btn btn-primary submit-order">{{ 'Đăng ký' if mode=='register' else 'Đăng nhập' }}</button></form><p>{% if mode=='register' %}Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a>{% else %}Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a>{% endif %}</p></section></main></body></html>
