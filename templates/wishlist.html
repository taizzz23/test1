<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yêu thích</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container page-content"><a class="back-link" href="{{ url_for('account') }}">← Tài khoản</a><h1>Sản phẩm yêu thích</h1><div class="products-grid">{% for p in products %}<article class="glass-panel product-card"><img class="product-image" src="{{ p.image }}" alt="{{ p.name }}"><h3>{{ p.name }}</h3><p>{{ p.price|money }}</p><a class="btn btn-primary" href="{{ url_for('index',product=p.id) }}#products">Xem sản phẩm</a><form method="post" action="{{ url_for('toggle_wishlist',pid=p.id) }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button class="btn btn-secondary">Bỏ yêu thích</button></form></article>{% else %}<p>Danh sách yêu thích đang trống.</p>{% endfor %}</div></main></body></html>
